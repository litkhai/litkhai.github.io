name: Deploy litkhai.github.io redirect

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      # The site lives at https://litkhai.dev (Vercel). litkhai.github.io only
      # publishes redirect/, which forwards every path there. A Pages custom
      # domain is not used: it would also move the project sites under
      # litkhai.github.io/<repo>/, which litkhai.dev does not serve.
      - name: Upload redirect
        uses: actions/upload-pages-artifact@v4
        with:
          path: redirect
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
