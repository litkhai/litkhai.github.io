<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ken Lee — moved to litkhai.dev</title>
    <link rel="canonical" href="https://litkhai.dev/" />
    <meta http-equiv="refresh" content="0; url=https://litkhai.dev/" />
    <script>
      // Keep the path, query and fragment; the meta refresh above is the no-JS fallback.
      // /quantum-notes/ was the Pages path of litkhai/notes-on-quantum before the
      // rename; its known pages have stubs in quantum-notes/, anything else lands here.
      var p = location.pathname, q = "/quantum-notes";
      if (p === q || p.indexOf(q + "/") === 0) {
        location.replace("https://litkhai.github.io/notes-on-quantum" + (p.slice(q.length) || "/") + location.search + location.hash);
      } else {
        location.replace("https://litkhai.dev" + p + location.search + location.hash);
      }
    </script>
  </head>
  <body>
    <p>This site moved to <a href="https://litkhai.dev/">litkhai.dev</a>.</p>
  </body>
</html>
